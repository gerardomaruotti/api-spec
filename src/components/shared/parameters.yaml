  acceptLanguageHeader:
    name: Accept-Language
    in: header
    schema:
      type: string
      enum:
      - it
      - en
      default: it
  PageParam:
    name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  PageSizeParam:
    name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
